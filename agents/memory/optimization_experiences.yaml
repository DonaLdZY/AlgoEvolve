    core_transform:
      - Freeze the official evaluator before formulating the solver.
      - Enumerate the bounded aggregate state, or short tuples of adjacent aggregate states.
      - Replace the nonlinear/table-valued term with binary state-selection variables and constant costs.
      - Link consecutive state tuples with flow-conservation or consistency constraints when transitions overlap.
      - Couple aggregate-state variables to the original decision variables without changing the evaluator.
    solve_trajectory:
      - Solve a tractable relaxation to obtain a valid lower bound.
      - Obtain a feasible incumbent and upper bound from a heuristic, existing solution, or early exact solve.
      - Use the difference between the upper and lower bounds to remove impossible state combinations or decisions.
      - Warm-start the reduced exact model from the incumbent.
      - If the full model remains too large, solve exact large neighborhoods around the incumbent, such as bounded aggregate-load deviations or fix-and-optimize subsets.
      - Recompute the final solution with the shared evaluator; only claim optimality when a trustworthy solver bound closes the gap.
    runtime_evidence:
      - solver family and solve status
      - incumbent objective and independently recomputed objective
      - best bound, absolute/relative gap, and whether optimality was proven
      - variable/constraint counts before and after reduction
      - relaxation used, pruning rule, warm-start source, and neighborhood definition
    failure_lessons:
      - A solver-reported objective or generated submission can be wrong when the evaluator or variable-to-output mapping has a bug; independently replay the evaluator.
      - A relaxation may not map directly to a feasible original solution; state the relaxation gap and implement reconstruction or repair when needed.
      - Enumerating all state combinations without bound-based pruning can make the model unnecessarily large.
      - A heuristic incumbent is valuable even when it is not globally optimal because it tightens the upper bound and seeds exact neighborhoods.
    not_applicable_when:
      - the aggregate state is continuous or has an impractically large range
      - the nonlinear objective depends on high-dimensional global history that cannot be localized
      - no deterministic evaluator or safe feasibility model can be constructed
      - the reduced exact model still cannot fit the configured solver, memory, or time budget
