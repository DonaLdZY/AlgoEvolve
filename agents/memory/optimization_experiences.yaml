schema_version: algoevolve.optimization_experiences.v1

cards:
  - experience_id: bounded_aggregate_state_milp_lns
    title: Bounded aggregate-state linearization with exact large-neighborhood search
    provenance: Generalized from a first-place bounded-state assignment optimization write-up.
    summary: >-
      For discrete decision problems whose nonlinear objective depends on a small bounded
      integer aggregate state or adjacent aggregate states, enumerate the aggregate-state
      combinations, linearize their costs, tighten the formulation with lower/upper bounds,
      and combine a feasible incumbent with exact large-neighborhood optimization.
    problem_signature:
      - discrete assignment, scheduling, routing, packing, or resource-allocation decisions
      - bounded integer aggregate state such as load, occupancy, count, inventory, or capacity usage
      - nonlinear or table-valued cost depending on one aggregate state or a short transition
      - a deterministic evaluator and at least one feasible incumbent or computable relaxation
